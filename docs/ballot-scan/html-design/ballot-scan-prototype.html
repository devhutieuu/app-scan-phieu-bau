<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm phiếu · Bản mẫu tương tác</title>
<style>
:root{
  --void:#ffffff;--carbon:#f7f8f8;--obsidian:#f2f3f4;--graphite:#e5e5e6;--smoke:#d0d6e0;
  --ash:#8a8f98;--fog:#62666d;--mist:#23252a;--bone:#383b3f;--paper:#08090a;
  --lime:#e4f222;--green:#27a644;--coral:#eb5757;--teal:#02b8cc;--iris:#6366f1;--lav:#8b5cf6;
  /* chữ trên badge ở nền sáng = sắc đậm của Pulse Green / Coral Red / Iris / Lavender (DESIGN.md) */
  --ok-ink:#1f7a35;--bad-ink:#b93c3c;--iris-ink:#4f46e5;--lav-ink:#6d3fd6;
  --font:'Inter Variable','Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'Berkeley Mono','JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow-subtle:#e5e5e6 0 0 0 1px inset;
  --shadow-xl:rgba(8,9,10,.12) 0 2px 4px 0;
  --shadow-cta:rgba(8,9,10,.12) 0 0 0 1px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--mist);font-family:var(--font);font-size:14px;line-height:1.5;
  font-feature-settings:"cv01" on,"ss03" on,"zero" on;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:-.013em}
.muted{color:var(--fog)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--graphite)}
.brand{display:flex;align-items:center;gap:8px;color:var(--paper);font-weight:510;font-size:15px;white-space:nowrap}
.brand svg{flex:none}
.session{display:flex;flex-direction:column;min-width:0}
.session b{font-weight:400;color:var(--mist);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session span{font-size:12px;color:var(--fog)}
.stats{display:flex;gap:2px;margin-left:auto}
.stat{display:flex;flex-direction:column;align-items:flex-end;padding:2px 12px;border-left:1px solid var(--graphite)}
.stat:first-child{border-left:0}
.stat .v{color:var(--paper);font-size:16px;font-weight:510;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:11px;color:var(--fog);white-space:nowrap}
.stat.bad .v{color:var(--bad-ink)}
.nav{display:flex;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--graphite);color:var(--mist);
  border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(8,9,10,.04);border-color:var(--smoke)}
.btn:disabled{color:var(--ash);cursor:not-allowed}
.btn-primary{background:var(--lime);color:#08090a;border:0;font-weight:510;font-size:14px;padding:9px 16px;letter-spacing:-.011em;box-shadow:var(--shadow-cta)}
.btn-primary:hover:not(:disabled){background:#eef54a}
.btn-primary:disabled{background:var(--graphite);color:var(--ash)}
/* Xác nhận phiếu không hợp lệ: nút chính đổi sang đỏ để không bấm theo quán tính. */
.btn-primary.btn-danger:not(:disabled){background:var(--coral);color:#fff;box-shadow:none}
.btn-primary.btn-danger:hover:not(:disabled){background:#e04848}
.btn-white{background:#08090a;color:#fff;border:0;font-weight:510}
.btn-white:hover:not(:disabled){background:#23252a}
.btn-sm{padding:3px 10px;font-size:12px}
.kbd{font-family:var(--mono);font-size:11px;line-height:16px;border:1px solid var(--smoke);border-radius:4px;padding:0 5px;color:var(--fog)}
.btn-primary .kbd{border-color:rgba(8,9,10,.25);color:rgba(8,9,10,.65)}
.btn-text{border-color:transparent;color:var(--fog)}
.btn-text:hover:not(:disabled){background:transparent;border-color:transparent;color:var(--paper)}
.btn-icon{padding:6px 8px}
.link{background:none;border:0;padding:0;color:var(--fog);text-decoration:underline;cursor:pointer;font-size:12px}
.link:hover{color:var(--paper)}
.okmark{color:var(--ash);font-size:13px}
.row .sub .sm{font-size:11px;color:var(--ash)}
.infoline{margin-top:10px;font-size:11px;color:var(--ash)}
.simwrap{position:relative}
.pop{position:absolute;right:0;bottom:calc(100% + 6px);width:260px;background:var(--obsidian);box-shadow:var(--shadow-subtle),var(--shadow-xl);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;z-index:10}
.pop[hidden]{display:none}
.pop .check{font-size:13px}
.badge-count{font-family:var(--mono);font-size:11px;background:rgba(8,9,10,.06);border-radius:4px;padding:0 5px;color:var(--fog)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:18px;border-radius:4px;padding:0 6px;background:rgba(8,9,10,.05);color:var(--fog);white-space:nowrap}
.chip.ok{background:rgba(39,166,68,.12);color:var(--ok-ink)}
.chip.bad{background:rgba(235,87,87,.12);color:var(--bad-ink)}
.chip.info{background:rgba(99,102,241,.12);color:var(--iris-ink)}
.chip.dec{background:rgba(139,92,246,.12);color:var(--lav-ink)}
.pill{border-radius:9999px;padding:2px 10px}

/* split */
.split{display:flex;min-height:0}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
#camPane{flex:0 0 38%}
#ballotPane{flex:1 1 0}
#listPane{display:none}
/* Máy tính chỉ duyệt (không dùng camera): danh sách phiếu chiếm màn chính, phiếu mở lại để sửa hiện bên phải */
body.nocam #camPane,body.nocam #divider{display:none!important}
body.nocam #listPane{display:flex;flex:1 1 0;border-right:1px solid var(--graphite)}
body.nocam #ballotPane{display:none}
body.nocam #btnList{display:none}
body.nocam.has-pending #ballotPane{display:flex;flex:0 0 52%}
#listPane .list-grid{flex:1;min-height:0}
#listPane .list-wrap{flex:1;min-height:0;display:flex}
.divider{flex:0 0 9px;cursor:col-resize;position:relative;touch-action:none}
.divider::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--graphite)}
.divider:hover::before,.divider.drag::before{background:var(--smoke);left:3px;width:3px}
.divider .grip{position:absolute;top:50%;left:1px;width:7px;height:36px;margin-top:-18px;border-radius:9999px;background:var(--obsidian);box-shadow:var(--shadow-subtle)}
.pane-head{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--graphite);min-height:49px}
.pane-title{color:var(--paper);font-weight:510;font-size:13px}
.spacer{flex:1}
select.sel{background:rgba(8,9,10,.02);border:1px solid var(--smoke);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--mist);max-width:220px}

/* camera */
.cam-stage{flex:1;min-height:0;container-type:size;display:grid;place-items:center;padding:16px}
.phone{height:min(100cqh,calc(100cqw * 4 / 3));aspect-ratio:3/4;border-radius:6px;background:#111;box-shadow:0 0 0 1px var(--smoke);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;background:#111}
.screen canvas{width:100%;height:100%;display:block}
.live{position:absolute;top:10px;left:10px;font-size:11px;color:#fff;background:rgba(8,9,10,.6);border-radius:9999px;padding:2px 9px;display:flex;align-items:center;gap:6px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.hud{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(8,9,10,.74);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:10px 12px}
.hud .msg{color:#fff;font-size:15px;font-weight:510;line-height:1.3}
.hud .sub{color:#d0d6e0;font-size:12px;margin-top:2px}
.hud .prog{height:3px;background:rgba(255,255,255,.25);border-radius:9999px;margin-top:8px;overflow:hidden}
.hud .prog i{display:block;height:100%;width:0;background:#fff}
.hud.done .prog i{background:var(--green)}
.meter{background:rgba(8,9,10,.02);box-shadow:var(--shadow-subtle);border-radius:6px;padding:6px 10px}
.meter .l{font-size:11px;color:var(--fog);display:flex;justify-content:space-between}
.meter .l b{font-weight:400;color:var(--mist);font-family:var(--mono)}
.meter .bar{height:3px;background:var(--graphite);border-radius:9999px;margin-top:5px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--mist);width:0}
.cam-foot{position:relative;display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--graphite);flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mist);cursor:pointer}
.check input{accent-color:var(--mist)}
.lbl{font-size:12px;color:var(--fog)}

/* ballot */
.ballot-scroll{flex:1;min-height:0;overflow:auto;padding:16px}
.sheet{max-width:780px;margin:0 auto;background:var(--carbon);border-radius:12px;box-shadow:var(--shadow-subtle);padding:20px 24px 16px;position:relative}
.sheet-title{text-align:center;color:var(--paper);font-size:17px;font-weight:510;letter-spacing:.02em}
.sheet-sub{text-align:center;color:var(--fog);font-size:12px;margin:2px 0 14px}
.sheet-head,.row{display:grid;grid-template-columns:28px 100px minmax(0,1fr);gap:10px;align-items:center}
.sheet-head{font-size:11px;color:var(--fog);padding:0 0 6px}
.row{padding:8px 0;border-top:1px solid var(--graphite)}
.row.need{box-shadow:inset 2px 0 0 var(--coral);margin-left:-12px;padding-left:12px}
.row .ln{color:var(--fog);font-family:var(--mono);font-size:12px;text-align:center}
.row .tag{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.row .sub{grid-column:2/4;font-size:12px;color:var(--fog);margin-top:-2px}
.row .sub .warn{color:var(--mist)}
.row .decide{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.opt{background:rgba(8,9,10,.04);border:1px solid var(--graphite);border-radius:9999px;padding:3px 12px;font-size:12px;color:var(--mist);cursor:pointer}
.opt:hover{border-color:var(--mist)}
.opt .mono{color:var(--fog);margin-right:4px}
.opt.void{color:var(--fog)}
.decide .lb{font-size:12px;color:var(--fog);align-self:center;padding:0 2px}
.inp{width:100%;height:36px;background:rgba(8,9,10,.02);border:1px solid var(--smoke);border-radius:6px;padding:0 12px;color:var(--mist);outline:none}
.inp:focus{border-color:var(--mist)}
.stt{position:relative;width:100px}
.stt::before,.stt::after{content:"";position:absolute;top:7px;bottom:7px;width:1px;background:rgba(8,9,10,.08);pointer-events:none}
.stt::before{left:33.33%}.stt::after{left:66.66%}
.stt .inp{font-family:var(--mono);font-size:17px;text-align:left;letter-spacing:calc(33.33px - 1ch);padding:0 0 0 calc((33.33px - 1ch) / 2)}
.row.void .inp{text-decoration:line-through;color:var(--ash)}
.row.empty .inp::placeholder{color:var(--smoke)}
.x{background:none;border:0;color:var(--ash);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.x:hover{color:var(--mist);background:rgba(8,9,10,.05)}
.flags{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.flag{display:flex;align-items:flex-start;gap:8px;font-size:12px;padding:8px 10px;border-radius:6px;background:rgba(8,9,10,.02);box-shadow:var(--shadow-subtle)}
.flag .dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none;background:var(--fog)}
.flag.block .dot{background:var(--coral)}
.flag.decide .dot{background:var(--lav)}
.flag.info .dot{background:var(--iris)}
.flag .t{flex:1}
.flag .acts{display:flex;gap:6px}
.rescan-mask{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px}
.rescan-mask b{color:var(--paper);font-weight:510;font-size:15px}
.empty-state{max-width:420px;margin:12vh auto 0;text-align:center}
.empty-state h3{color:var(--paper);font-weight:510;font-size:20px;letter-spacing:-.012em;margin:16px 0 6px}
.empty-state p{color:var(--fog);margin:0 0 20px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:13px;max-width:300px;margin:0 auto;color:var(--fog)}
.foot{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--graphite)}
.concl{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.concl b{font-weight:510;color:var(--paper);font-size:14px}
.concl b.ok{color:var(--ok-ink)}.concl b.bad{color:var(--bad-ink)}
.concl span{font-size:12px;color:var(--fog)}
.banner{max-width:780px;margin:0 auto 12px;font-size:12px;padding:8px 12px;border-radius:6px;background:rgba(99,102,241,.1);color:var(--iris-ink);box-shadow:inset 0 0 0 1px rgba(99,102,241,.25)}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(8,9,10,.35);display:none;z-index:20;padding:40px 24px}
.ov.open{display:flex;justify-content:center;align-items:flex-start}
.panel{background:var(--carbon);box-shadow:var(--shadow-subtle),var(--shadow-xl);border-radius:12px;width:min(1180px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--graphite)}
.panel-head h2{margin:0;font-size:16px;font-weight:510;color:var(--paper);letter-spacing:-.01em}
.panel-body{flex:1;min-height:0;overflow:auto}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--fog);cursor:pointer}
.tab:hover{color:var(--mist)}
.tab.on{background:rgba(8,9,10,.06);color:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--fog);font-weight:400;font-size:12px;text-align:left;padding:8px 12px;border-bottom:1px solid var(--graphite);position:sticky;top:0;background:var(--carbon);z-index:1}
td{padding:7px 12px;border-bottom:1px solid var(--graphite);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(8,9,10,.02)}
tr.sel td{background:rgba(8,9,10,.04)}
/* Kết quả (theo DESIGN.md: chỉ thang xám, lime chỉ cho nút chính): nhóm dẫn đầu nền xám nhạt + chữ đậm, kẻ ngăn sau người cuối nhóm */
table.rank td.nm{color:var(--fog)}
table.rank tr.lead td{background:var(--obsidian)}
table.rank tr.lead td.nm{color:var(--paper);font-weight:510}
table.rank tr.edge td{border-bottom:1px solid var(--fog)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:30px;height:42px;object-fit:cover;border-radius:2px;display:block;box-shadow:0 0 0 1px var(--graphite)}
.list-bar{padding:10px 20px;display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--graphite);position:sticky;top:0;background:var(--carbon);z-index:2}
.list-bar select.sel{margin-left:8px}
.list-bar .tab,.list-bar label{white-space:nowrap}
.tab.warnc{color:var(--paper);font-weight:510}
th.sortable{cursor:pointer;user-select:none;top:49px}th.sortable:hover{color:var(--mist)}th.sortable.on{color:var(--paper)}
.list-grid th{top:49px}
th.flagc,td.flagc{width:28px;padding-right:0;text-align:center}
.fl{font-size:15px}.fl.on{color:var(--paper)}.fl.done{color:var(--ash)}
tr.flagged td{background:var(--obsidian)}
.flagcard{border-radius:6px;padding:10px 12px;margin-bottom:12px;background:var(--obsidian);box-shadow:var(--shadow-subtle);font-size:13px}
.flagcard b{color:var(--paper);font-weight:510}
.flagcard .fnote{margin:6px 0 10px;color:var(--mist);font-size:14px}
.flagcard .acts{display:flex;gap:8px}
.flagcard.done{background:rgba(8,9,10,.03);box-shadow:none;color:var(--fog)}
.badge-flag{font-size:11px;background:rgba(8,9,10,.06);color:var(--paper);border-radius:4px;padding:0 5px;margin-left:4px}
.devdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.devdot.off{background:var(--smoke)}
#btnDev.warn{color:var(--bad-ink)}
.devtbl td{padding:8px 10px}
#devLine{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;text-align:right}
.modal:has(#devModal){width:min(720px,94vw)}
.devtbl .warnc{color:var(--bad-ink);font-size:12px}
.qrbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.qrbox img{width:260px;height:260px;image-rendering:pixelated;border-radius:6px;box-shadow:0 0 0 1px var(--graphite);background:#fff}
.qrbox .url{font-family:var(--mono);font-size:15px;color:var(--paper);user-select:all}
.qrbox .hint{font-size:12px;color:var(--fog);max-width:340px}
.qr-empty{padding:40px 20px}
.list-grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;height:100%;min-height:0}
.list-grid>div{overflow:auto;min-height:0}
.detail{border-left:1px solid var(--graphite);padding:16px 20px}
.detail img.comp{width:100%;border-radius:6px;box-shadow:0 0 0 1px var(--graphite);cursor:zoom-in;display:block}
.detail h3{margin:0 0 4px;color:var(--paper);font-weight:510;font-size:15px}
.detail .sect{margin-top:16px}
.detail .sect h4{margin:0 0 6px;font-size:11px;color:var(--fog);font-weight:400;text-transform:uppercase;letter-spacing:.06em}
.vlist{margin:0;padding:0;list-style:none;font-size:13px}
.vlist li{padding:3px 0;display:flex;gap:8px}
.hist{margin:0;padding:0;list-style:none;font-size:12px;color:var(--fog)}
.hist li{padding:3px 0;display:flex;gap:10px}
.hist li .mono{color:var(--ash);flex:none}
.zoomed{position:fixed;inset:0;z-index:40;background:rgba(8,9,10,.55);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.zoomed img{max-width:100%;max-height:100%;border-radius:6px}
.res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px 20px}
.card{background:rgba(8,9,10,.02);box-shadow:var(--shadow-subtle);border-radius:6px;padding:10px 12px}
.card .l{font-size:12px;color:var(--fog)}
.card .v{font-size:24px;color:var(--paper);font-weight:400;letter-spacing:-.012em;font-variant-numeric:tabular-nums}
.card .s{font-size:11px;color:var(--fog)}
.card input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--smoke);font-size:22px;color:var(--paper);outline:none;padding:0;font-variant-numeric:tabular-nums}
.note{margin:0 20px 12px;font-size:12px;color:var(--fog)}
.verdict{margin:0 20px 12px;padding:10px 12px;border-radius:6px;font-size:13px;color:var(--mist);box-shadow:var(--shadow-subtle)}
.pbar{position:relative;height:6px;background:var(--graphite);border-radius:9999px;width:100%;min-width:140px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9999px;background:var(--mist)}
.pbar i.win{background:var(--green)}
.pbar .th{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--fog)}
.form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--fog)}
.field .inp,.field select,.field textarea{background:rgba(8,9,10,.02);border:1px solid var(--smoke);border-radius:6px;padding:8px 12px;color:var(--mist);outline:none}
.field textarea{min-height:260px;font-family:var(--mono);font-size:13px;resize:vertical}
.field .hint{font-size:12px;color:var(--ash)}
.span2{grid-column:1/3}
.panel-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--graphite)}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,9,10,.35);display:none;align-items:center;justify-content:center}
.modal-wrap.open{display:flex}
.modal{width:min(460px,92vw);background:var(--obsidian);border-radius:12px;box-shadow:var(--shadow-subtle),var(--shadow-xl);padding:20px}
.modal h3{margin:0 0 4px;color:var(--paper);font-weight:510;font-size:16px}

<script>
/* ============ tiện ích ============ */
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(3,'0');
const pad2=n=>String(n).padStart(2,'0');
const pad3=pad;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=t=>new Date(t).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const dt=t=>{const d=new Date(t);return `${tm(t)} ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`};
const SANS='"Inter","Helvetica Neue",Arial,sans-serif';
const stripVN=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i+=7){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});

/* ============ dữ liệu phiên ============ */
// Chưa phân vòng bầu (vòng 1/vòng 2): quy tắc trúng cử sẽ định nghĩa sau. Hiện chỉ đếm phiếu + tỉ lệ.
const overText=()=>'Chọn quá số người tối đa';
const TOP_N=18;  // số người dẫn đầu được làm nổi bật ở màn Kết quả
// Danh sách ứng viên thật (tạm dùng cho tới khi có danh sách chính thức). Sửa trong Thiết lập.
const CAND_LIST=`001 Nguyễn Thiên Huy
002 Huỳnh Ngọc Nhân
003 Trần Thị Mai
004 Lê Văn Phúc
005 Phạm Minh Tuấn
006 K' Vượng
007 Võ Thị Hồng Nhung
008 Đặng Quốc Bảo
009 Bùi Thị Thanh Hà
010 Ngô Văn Thành
011 Đỗ Thị Kim Oanh
012 Hồ Ngọc Ân
013 Dương Văn Lộc
014 Lý Thị Bích Ngọc
015 Trương Minh Khang
016 Phan Thị Diệu Hiền
017 Y Sơn Niê
018 Ka Hương
111 Hoàng Văn Long`;
function loadCandText(){try{return localStorage.getItem('kp-cands')||CAND_LIST}catch(e){return CAND_LIST}}
const S={
  cfg:{session:'Bầu cử Hội Thánh nhiệm kỳ 2026–2028',seats:18,rows:18,dupRule:'invalid',blankRule:'valid',denom:'valid',operator:'Tổ kiểm phiếu 1',issued:180},
  cands:[],ballots:[],pending:null,nextNo:1,locked:null,log:[]
};
let CMAP=new Map();
function parseCands(text){
  const list=[],bad=[];let first=true;
  for(const raw of String(text).split(/\r?\n/)){
    const l=raw.replace(/\u00a0/g,' ').trim();if(!l)continue;
    const m=l.match(/^(\d+)[\s.\-:·,;]+(.+)$/);
    if(m){list.push({stt:+m[1],name:m[2].replace(/\s+/g,' ').trim()})}
    else if(first&&!/^\d/.test(l)){/* dòng tiêu đề, bỏ qua */}
    else bad.push(l);
    first=false;
  }
  return {list,bad};
}
function checkCands(text){
  const {list,bad}=parseCands(text),seen=new Set(),dup=[],out=[];
  for(const c of list){if(c.stt<1||c.stt>999)out.push(c.stt);if(seen.has(c.stt)){if(!dup.includes(c.stt))dup.push(c.stt)}seen.add(c.stt)}
  return {list,bad,dup,out};
}
/* ---- Nhập danh sách từ file Excel (.xlsx) / Word (.docx) / CSV — đọc ngay trong trình duyệt, không cần mạng ---- */
async function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),out={};
  let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('không phải file nén Office');
  let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true),td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u.subarray(p+46,p+46+nl));
    out[name]=async()=>{const d=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=u.subarray(d,d+csz);
      if(meth===0)return td.decode(raw);
      if(meth!==8)throw new Error('kiểu nén không hỗ trợ');
      return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};
    p+=46+nl+xl+cl;
  }
  return out;
}
const xmlDoc=t=>new DOMParser().parseFromString(t,'application/xml');
const tags=(n,t)=>[...n.getElementsByTagNameNS('*',t)];
async function readXlsx(buf){
  const z=await unzip(buf);
  const ss=z['xl/sharedStrings.xml']?tags(xmlDoc(await z['xl/sharedStrings.xml']()),'si').map(si=>tags(si,'t').filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')):[];
  let sheet=null;
  try{const wb=xmlDoc(await z['xl/workbook.xml']()),rid=tags(wb,'sheet')[0].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const rel=tags(xmlDoc(await z['xl/_rels/workbook.xml.rels']()),'Relationship').find(r=>r.getAttribute('Id')===rid);
    const tg=rel.getAttribute('Target').replace(/^\/?(xl\/)?/,'');sheet='xl/'+tg}catch(e){}
  if(!z[sheet])sheet=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)))[0];
  if(!sheet)throw new Error('file Excel không có trang tính');
  const col=r=>{let c=0;for(const ch of r.replace(/\d+$/,''))c=c*26+ch.charCodeAt(0)-64;return c-1};
  return tags(xmlDoc(await z[sheet]()),'row').map(row=>{const cells=[];
    for(const c of tags(row,'c')){const t=c.getAttribute('t'),v=tags(c,'v')[0]?.textContent??'';
      const val=t==='s'?(ss[+v]??''):t==='inlineStr'?tags(c,'t').map(x=>x.textContent).join(''):v;
      cells[c.getAttribute('r')?col(c.getAttribute('r')):cells.length]=String(val).trim()}
    return {cells:[...cells].map(x=>x??'')}});
}
async function readDocx(buf){
  const z=await unzip(buf);if(!z['word/document.xml'])throw new Error('file Word không có nội dung');
  const body=tags(xmlDoc(await z['word/document.xml']()),'body')[0],rows=[];
  const ptext=p=>{let s='';for(const n of p.getElementsByTagNameNS('*','*')){if(n.localName==='t')s+=n.textContent;else if(n.localName==='tab')s+=' '}return s.trim()};
  const walk=el=>{for(const n of el.children){
    if(n.localName==='p'){const t=ptext(n);if(t)rows.push({cells:[t],numbered:tags(n,'numPr').length>0})}
    else if(n.localName==='tbl'){for(const tr of tags(n,'tr'))rows.push({cells:tags(tr,'tc').map(tc=>tags(tc,'p').map(ptext).filter(Boolean).join(' '))})}
    else if(n.localName==='sdt'||n.localName==='sdtContent')walk(n)}};
  walk(body);return rows;
}
function readCsv(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/),sep=[';','\t',','].find(c=>lines.some(l=>l.includes(c)));
  return lines.map(l=>({cells:sep?l.split(sep).map(x=>x.replace(/^"|"$/g,'').replace(/""/g,'"').trim()):[l.trim()]}));
}
/* Bảng → danh sách: tìm dòng tiêu đề (STT / Họ và tên, hoặc Họ + Tên tách cột); không có tiêu đề thì lấy ô số đầu tiên làm STT, ô chữ kế tiếp làm họ tên. */
function rowsToCands(rows){
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim();
  const isNum=s=>/^\d{1,3}(\.0+)?\.?$/.test(String(s).trim());
  let hdr=-1,sttC=-1,nameC=[];
  for(let i=0;i<Math.min(rows.length,15)&&hdr<0;i++){const h=rows[i].cells.map(norm);
    const full=h.findIndex(x=>/^(ho (va )?ten|ho ten.*|ten ung vien|ung vien|name|full ?name)$/.test(x));
    const ho=h.findIndex(x=>/^ho( (va )?(ten )?(dem|lot|chu lot))?$/.test(x)),ten=h.findIndex(x=>/^ten$/.test(x));
    if(full>=0)nameC=[full];else if(ho>=0&&ten>=0)nameC=[ho,ten];else if(ten>=0)nameC=[ten];
    if(nameC.length){hdr=i;sttC=h.findIndex(x=>/^(stt|so thu tu|tt|so tt|so|ma so|no\.?)$/.test(x))}}
  const list=[];let auto=0,noStt=0,numbered=0;

const EV=new WeakMap();

  if(!rowEdited(r)&&r.ocr&&r.stt&&r.ocr.sttConf!=null&&r.ocr.sttConf<.7&&!v.doubt.includes('stt'))v={...v,doubt:[...v.doubt,'stt']};

  const top=r.nm?r.nm.top.map(Number).filter(t=>cand(t)):[];
  if(top.length&&(v.status==='empty'||!top.slice(0,2).includes(+stt))){
    const c0=cand(top[0]);

    else v={...v,suggest:c0.stt,warn:v.status==='empty'?`Chưa có STT. Tên viết giống ${pad(c0.stt)} ${c0.name}`:`Tên viết giống ${pad(c0.stt)} ${c0.name}, không khớp STT ${stt}`};

function computeBallot(b){
  const flags=[];const cnt={},lines={};const voids=[],warns=[];
  const evs=b.rows.map(evalRow);
  evs.forEach((ev,i)=>{
    if(ev.warn)warns.push(`Dòng ${i+1}: ${ev.warn}`);
    if(ev.status==='void'){voids.push({line:i+1,reason:ev.reason});return}
    if(ev.status!=='ok')return;
    cnt[ev.choice]=(cnt[ev.choice]||0)+1;(lines[ev.choice]=lines[ev.choice]||[]).push(i+1);
  });
  const has=evs.map(ev=>ev.status!=='empty');
  const last=has.lastIndexOf(true);
  if(last>0&&has.slice(0,last).includes(false))flags.push({level:'info',text:'Có dòng trống xen giữa các dòng đã điền. Chỉ ghi chú, không ảnh hưởng kết quả.'});
  const distinct=Object.keys(cnt).map(Number);
  const dups=distinct.filter(s=>cnt[s]>1);
  let invalid=null;
  if(dups.length){
    const t=dups.map(s=>`${pad(s)} ${cand(s).name} (dòng ${lines[s].join(', ')})`).join('; ');
    invalid=invalid||`Ghi trùng: ${dups.map(s=>pad(s)).join(', ')}`;flags.push({level:'block',text:`Ghi trùng: ${t}.`});
  }
  if(distinct.length>S.cfg.seats){invalid=invalid||overText();flags.push({level:'block',text:`Chọn ${distinct.length} người, quá ${S.cfg.seats}.`})}
  if(voids.length)flags.push({level:'info',text:`${voids.length} dòng không hợp lệ (${voids.map(x=>`dòng ${x.line}: ${x.reason}`).join('; ')}). Ảnh hưởng tới cả phiếu: chưa quy định, tạm tính phiếu vẫn hợp lệ.`});
  if(warns.length)flags.push({level:'hint',text:`${warns.join('; ')}. Xem ảnh dòng đó. Nếu phiếu thiếu STT hoặc họ tên, bấm Phiếu hỏng.`});
  if(b.dupOf&&!b.dupOk&&!b.decidedAt)flags.push({level:'block',code:'dup',exact:!!b.dupOf.exact,text:b.dupOf.exact?`Phiếu số ${pad3(b.dupOf.no)} đã ghi nhận rồi (${b.dupOf.station||'bàn khác'}). Tờ này đã quét, không tính lần 2.`:`Giống phiếu #${pad3(b.dupOf.no)} (${b.dupOf.station||'bàn khác'}) — có thể quét 2 lần.`});
  if(b.below&&b.below.status==='ink'&&!b.belowOk&&!b.manualInvalid&&!b.decidedAt)flags.push({level:'block',code:'below',text:'Có nét bút bên dưới dòng cuối. Xem phần dưới của ảnh phiếu: nếu là chữ ghi thêm thì phiếu không hợp lệ.'});
  if(b.manualInvalid){invalid=b.manualInvalid.reason;flags.push({level:'block',code:'manual',text:`Phiếu hỏng: ${b.manualInvalid.reason}`})}

  return{flags,status,reason:invalid,votes:invalid?[]:distinct.sort((a,c)=>a-c),count:distinct.length};
}
function statusInfo(st,reason,n){

function tally(){

  for(const b of S.ballots){if(b.status==='invalid')t.invalid++;else if(b.status==='blank')t.blank++;else{t.validVoted++;b.votes.forEach(s=>t.votes[s]=(t.votes[s]||0)+1)}}

  if(b.below&&b.below.status==='ink'&&!b.belowOk&&!b.manualInvalid)return toast('Máy thấy nét bút bên dưới dòng cuối. Bấm Phiếu hỏng hoặc Không phải chữ trước.',null,null,5000);

  sendLabel(b);
  const st=statusInfo(b.status,b.reason,b.votes.length);
  const reopened=!!b.reopened;
  if(reopened&&flagOpen(b)){b.flag.done={by:STATION.name,at:Date.now()};hist(b,'Máy tính duyệt cờ (sửa và chấp nhận lại)')}
  if(reopened){b.version++;hist(b,`Chấp nhận lại (bản ${b.version}): ${st.label}`);log(`Sửa phiếu #${pad3(b.no)} → ${st.label}`);delete b.reopened;delete b.snapshot}
  else{hist(b,`Chấp nhận: ${st.label}`);log(`Ghi nhận phiếu #${pad3(b.no)}: ${st.label}`);S.ballots.push(b)}
  pushBallot(b);
  S.pending=null;b.composite=null;makeComposite(b).then(refreshList);
  camRelease();renderAll();
  toast(`Đã lưu phiếu #${pad3(b.no)} · ${st.short} · ảnh ghép`,'Hoàn tác',()=>reopen(b,'Hoàn tác ngay sau khi chấp nhận'),8000);

function markInvalid(reason){
  const b=S.pending;if(!b||b.rescanning)return;if(S.locked)return toast('Phiên đã chốt kết quả.');

}
function rescan(){

/* ---- nhận dạng chữ thật: máy chủ cục bộ tools/ocr_server.py (Apple Vision, offline) ---- */
// Trang mở thẳng từ máy chủ (http://localhost:8766 hoặc https://<IP>:8443) thì gọi chính địa chỉ đó; mở bằng file hoặc cổng 8765 cũ thì gọi localhost:8766.
const OCR={url:(location.protocol==='file:'||location.port==='8765')?'http://localhost:8766':location.origin,up:false};
const useRealOcr=()=>OCR.up;
// Chỉ hiện chữ khi có sự cố; bình thường để trống cho gọn.
function ocrLabel(){const l=$('#ocrLbl');if(!l)return;l.textContent=SH.on?(SH.ok?'':'· Mất kết nối máy chủ'):OCR.up?'':'· Máy đọc STT chưa bật (gõ tay)';l.style.color='var(--bad-ink)';const l2=$('#ocrLbl2');if(l2){l2.textContent=l.textContent;l2.style.color=l.style.color}}
async function pingOcr(){const was=OCR.up;try{const r=await fetch(OCR.url+'/health',{cache:'no-store'});OCR.up=r.ok;const h=await r.json();if(h.shared&&OCR.url===location.origin&&!SH.on){SH.on=true;syncLoop()}}catch(e){OCR.up=false}if(was!==OCR.up)renderCamFoot();ocrLabel()}
async function runRealOcr(b){
  b.reading=true;renderBallot();
  try{
    const r=await fetch(OCR.url+'/read',{method:'POST',body:JSON.stringify({image:b.photo,engine:'none',stts:S.cands.map(c=>c.stt),no:b.no,editing:!!b.reopened})}).then(x=>x.json());
    if(r.error)throw new Error(r.error);
    // Số in trên giấy (góc trên phải) là mã phiếu. Phiếu chưa ghi nhận thì lấy số đó làm mã; phiếu đang mở lại để sửa thì chỉ báo nếu đặt nhầm tờ.
    if('sheet' in r){
      if(r.sheet&&b.reopened&&b.sheet&&r.sheet!==b.sheet)toast(`Tờ đang đặt là phiếu số ${pad3(r.sheet)}, không phải phiếu #${pad3(b.no)} đang sửa. Đặt đúng tờ rồi bấm Quét lại phiếu.`,null,null,7000);
      else if(r.sheet&&!b.reopened){if(b.no!==r.sheet)hist(b,`Đọc được số phiếu in trên giấy: ${pad3(r.sheet)}`);b.no=r.sheet;b.sheet=r.sheet}
      else if(!r.sheet&&!b.sheet){hist(b,'Không đọc được số phiếu in trên giấy');if(r.aligned)toast('Chưa đọc được số phiếu ở góc trên phải. Đừng che góc đó rồi bấm Quét lại phiếu.',null,null,6000)}
    }
    b.rows=Array.from({length:S.cfg.rows},(_,i)=>{const o=r.rows[i]||{stt:''};const row={line:i+1,ocr:o,stt:o.stt||'',unread:!!o.unreadable&&!o.stt,nameInk:!!o.nameInk};row.o0={stt:row.stt};return row});
    if(r.page){b.raw=b.raw||b.photo;b.photo=r.page;b.hash=fnv(r.page);b.aligned=true;b.crops=null;b.composite=null;ensureCrops(b)}
    else{b.aligned=false;if(b.source==='camera')toast('Không thấy đủ 4 góc phiếu, máy đọc có thể sai. Chỉnh phiếu cho đủ 4 góc rồi bấm Quét lại phiếu.')}
    if(r.scan)b.scanId=r.scan;
    b.dupOf=r.dupOf||null;b.dupOk=false;if(b.dupOf)hist(b,b.dupOf.exact?`Cảnh báo: phiếu số ${pad3(b.dupOf.no)} đã ghi nhận rồi (${b.dupOf.station})`:`Cảnh báo: giống phiếu #${pad3(b.dupOf.no)} đã ghi nhận (${b.dupOf.station})`);
    b.below=r.below||null;b.belowOk=false;if(b.below&&b.below.status==='ink')hist(b,'Cảnh báo: có nét bút bên dưới dòng cuối');
    if(r.names==='wait'&&r.scan)pollNames(b,r.scan);
    b.ocrEngine='none';hist(b,`Máy đọc STT (${r.ms} ms${r.aligned?'':', ảnh chưa nắn theo 4 góc'})`);
  }catch(e){toast('Máy đọc chữ lỗi: '+(e.message||e)+'. Hãy gõ tay các dòng.')}
  b.reading=false;if(S.pending===b)renderBallot();
}
// Kiểm chéo tên chạy nền ở máy chủ (vài giây đến vài chục giây). Hỏi lại cho tới khi xong; phiếu đã quét lại / đã duyệt thì thôi.
async function pollNames(b,scan){
  for(let k=0;k<80;k++){
    await new Promise(r=>setTimeout(r,1500));
    if(b.scanId!==scan||b.decidedAt)return;
    try{const j=await fetch(`${OCR.url}/names?scan=${scan}`,{cache:'no-store'}).then(x=>x.json());
      if(j.state==='wait')continue;
      (j.rows||[]).forEach(x=>{const r=b.rows[x.line-1];if(r)r.nm={top:x.top,sure:x.sure!==false,read:x.read||''}});
      const n=b.rows.filter(r=>{const e=evalRow(r);return e.suggest||e.nameUnsure}).length;
      hist(b,j.state==='done'?`Máy kiểm tên xong (${Math.round(j.ms/1000)} giây): ${n?n+' dòng tên không khớp STT':'tên khớp STT'}`:'Máy kiểm tên lỗi, người duyệt tự so tên');
      if(S.pending===b)renderBallot();return}catch(e){}
  }
}
function onCaptured(photo){
  const b=S.pending;
  if(b&&b.rescanning){b.photo=photo;b.hash=fnv(photo);b.rescanning=false;b.rescans++;b.capturedAt=Date.now();b.rows=buildRows();b.crops=null;b.manualInvalid=null;hist(b,`Quét lại lần ${b.rescans}, máy đọc lại`);log(`Quét lại phiếu #${pad3(b.no)}`);ensureCrops(b);if(useRealOcr())runRealOcr(b)}
  else if(SH.on){
    // Nhiều bàn: mã phiếu do máy chủ cấp để 2 bàn không trùng mã. Mất kết nối thì không nhận phiếu (tránh ghi đè nhau).
    fetch(OCR.url+'/next',{method:'POST',headers:SH.hdr(),body:'{}'}).then(x=>x.json()).then(r=>{
      S.pending=newBallot(photo,r.no);ensureCrops(S.pending);runRealOcr(S.pending);renderAll()
    }).catch(()=>{camRelease();toast('Mất kết nối với máy chủ, chưa nhận phiếu này. Kiểm tra mạng rồi đặt lại phiếu.',null,null,6000);renderAll()});
    return;
  }
  else{S.pending=newBallot(photo);ensureCrops(S.pending);if(useRealOcr())runRealOcr(S.pending)}
  renderAll();
}
function reopen(b,reason){
  if(S.pending)return toast('Đang có phiếu chờ duyệt, xử lý xong trước khi mở lại phiếu khác.');
  if(S.locked)return toast('Phiên đã chốt, mở khóa trong màn Kết quả trước.');
  b.snapshot=JSON.stringify({rows:b.rows,manualInvalid:b.manualInvalid});
  b.reopened={reason};hist(b,`Mở lại để sửa: ${reason}`);log(`Mở lại phiếu #${pad3(b.no)}: ${reason}`);
  S.pending=b;ensureCrops(b);closeOverlay();renderAll();
}
function cancelReopen(){const b=S.pending;if(!b?.reopened)return;Object.assign(b,JSON.parse(b.snapshot));delete b.snapshot;delete b.reopened;hist(b,'Hủy sửa, giữ nguyên kết quả cũ');S.pending=null;renderAll()}

function rowView(r,i){

  if(ev.status==='ok')nm=`<div class="nm" style="font-size:15px;color:var(--paper)">${esc(c.name)}</div>`;
  else if(ev.status==='void'){cls+=' void';nm=`<div class="nm" style="font-size:15px;color:var(--bad-ink)">Không có trong danh sách</div>`}
  else nm=`<div class="nm muted" style="font-size:15px">—</div>`;

    sub=`${crop?`<img class="crop" data-i="${i}" style="height:48px" src="${crop}" alt="Dòng ${i+1} trên phiếu giấy">`:''}${ev.warn&&!ev.suggest&&!ev.nameUnsure?`<b class="warn">${esc(ev.warn)}</b>`:''}`}
  // Tên viết không khớp STT: 1 dòng riêng dưới ảnh cắt, kèm nút đổi STT theo tên.

    ${nm}
    ${sub?`<div class="sub">${sub}</div>`:''}
    ${nmFix}${fix}
  </div>`;
}

const CW=900,CH=1200,cv=$('#camCanvas');cv.width=CW;cv.height=CH;const cx=cv.getContext('2d');
const video=$('#camVideo');
const cam={phase:'off',flash:0,last:performance.now(),stream:null};
cam.rot=0;cam.wide=localStorage.getItem('kp-wide')!=='0';cam.zoom=null;
const SS=.72;
function camRelease(){if(cam.phase!=='off')cam.phase='live'}
function beep(){try{const a=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=1046;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.16);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.17)}catch(e){}}
function overlayBusy(){return ovMode||$('#modalWrap').classList.contains('open')}
function camDraw(now){
  cx.fillStyle='#000';cx.fillRect(0,0,CW,CH);
  if(cam.phase!=='off'){
    if(video.readyState>=2)drawVideo(cx,CW,CH,cam.wide);
    if(!cam.wide){cx.setLineDash([18,12]);cx.strokeStyle=cam.phase==='captured'?'#27a644':'rgba(208,214,224,.7)';cx.lineWidth=3;const gw=SHEET_W*SS,gh=SHEET_H*SS;cx.strokeRect((CW-gw)/2,(CH-gh)/2,gw,gh);cx.setLineDash([])}
  }
  const f=now-cam.flash;if(f<380){cx.fillStyle=`rgba(255,255,255,${.5*(1-f/380)})`;cx.fillRect(0,0,CW,CH)}
}
let hudKey='';
function camHud(){
  const b=S.pending;let msg='',sub='',prog=0,done=false;
  if(cam.phase==='off'){msg='Chưa mở được camera';sub='Chọn camera ở ô phía trên, hoặc cho phép trình duyệt dùng camera'}
  else if(cam.phase==='captured'&&b&&!b.rescanning){msg=`Đã chụp xong phiếu #${pad3(b.no)}`;sub='Mời xem bên phải';prog=1;done=true}
  else if(S.pending&&!b.rescanning){msg='Hãy duyệt phiếu bên phải trước';sub='Máy tạm chưa chụp phiếu mới';}
  else{msg=b?.rescanning?`Quét lại phiếu #${pad3(b.no)}`:'Đặt phiếu vào khung';sub='Bấm nút Chụp (bản mẫu chưa tự chụp)'}
  const key=msg+sub+done;if(key!==hudKey){hudKey=key;$('#hudMsg').textContent=msg;$('#hudSub').textContent=sub;$('#hud').classList.toggle('done',done)}
  $('#hudProg').style.width=(prog*100)+'%';
}
function loop(now){const d=Math.min(250,now-cam.last);cam.last=now;camDraw(now);camHud();requestAnimationFrame(loop)}
document.addEventListener('click',()=>{['#badPop'].forEach(q=>{const p=$(q);if(p)p.hidden=true})});
function renderCamFoot(){
  ocrLabel();
  const f=$('#camFoot');
  {
    const z=cam.zoom;
    f.innerHTML=`<button class="btn btn-sm" id="rotBtn" title="Xoay hình 90°">↻ Xoay${cam.rot?` (${cam.rot}°)`:''}</button>
      <label class="check" title="Hiện toàn bộ khung hình, thu nhỏ hết cỡ"><input type="checkbox" id="wideChk" ${cam.wide?'checked':''}> Góc rộng</label>
      ${z?`<label class="check">Thu phóng <input type="range" id="zoomRng" min="${z.min}" max="${z.max}" step="${z.step}" value="${z.v}" style="width:90px"></label>`:''}
      <span class="spacer"></span><button class="btn btn-sm" id="snap" title="Phím Space">Chụp</button>`;
    $('#snap').onclick=realSnap;
    $('#rotBtn').onclick=()=>{cam.rot=(cam.rot+90)%360;localStorage.setItem('kp-rot:'+(cam.dev||''),cam.rot);renderCamFoot()};
    $('#wideChk').onchange=e=>{cam.wide=e.target.checked;localStorage.setItem('kp-wide',cam.wide?'1':'0');if(cam.wide&&z)setZoom(z.min).then(renderCamFoot)};
    if(z)$('#zoomRng').oninput=e=>setZoom(+e.target.value);

// Vẽ khung hình camera (đã xoay theo cam.rot) vào vùng W×H: wide = hiện toàn bộ khung, không wide = phóng cho đầy vùng.
function drawVideo(g,W,H,wide){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw)return;
  const q=cam.rot%180!==0,fw=q?vh:vw,fh=q?vw:vh,s=(wide?Math.min:Math.max)(W/fw,H/fh);
  g.save();g.translate(W/2,H/2);g.rotate(cam.rot*Math.PI/180);g.drawImage(video,-vw*s/2,-vh*s/2,vw*s,vh*s);g.restore()}
async function setZoom(v){const tr=cam.stream?.getVideoTracks()[0];if(!tr||!cam.zoom)return;try{await tr.applyConstraints({advanced:[{zoom:v}]});cam.zoom.v=v}catch(e){}}
function realSnap(){
  if(cam.phase==='off'||video.readyState<2)return;
  if(S.pending&&!S.pending.rescanning)return toast('Xử lý xong phiếu đang duyệt trước khi chụp phiếu mới.');
  if(S.locked)return toast('Phiên đã chốt kết quả.');
  // Chụp nguyên khung hình (đã xoay), không cắt: máy đọc tự tìm 4 góc phiếu để nắn thẳng.
  const vw=video.videoWidth,vh=video.videoHeight,q=cam.rot%180!==0,fw=q?vh:vw,fh=q?vw:vh,s=Math.min(1,2400/Math.max(fw,fh));
  const c=document.createElement('canvas');c.width=Math.round(fw*s);c.height=Math.round(fh*s);drawVideo(c.getContext('2d'),c.width,c.height,true);
  cam.phase='captured';cam.flash=performance.now();beep();onCaptured(c.toDataURL('image/jpeg',.85));
}
async function listDevices(sel){
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  $('#camSource').innerHTML=(sel?'':`<option value="ask">Chọn camera…</option>`)+devs.map((d,i)=>`<option value="cam:${d.deviceId}">${esc(d.label||'Camera '+(i+1))}</option>`).join('');
  $('#camSource').value=sel||'ask';
}
async function useCamera(id){
  try{
    if(cam.stream)cam.stream.getTracks().forEach(t=>t.stop());
    // Xin độ phân giải cao, tỉ lệ 4:3 (rộng hơn 16:9 theo chiều dọc); trình duyệt chọn mức gần nhất camera có.
    const res={width:{ideal:3840},height:{ideal:2880}};
    const st=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id},...res}:res,audio:false});
    cam.stream=st;video.srcObject=st;await video.play();
    const tr=st.getVideoTracks()[0],zc=tr.getCapabilities?.().zoom;
    cam.zoom=zc?{min:zc.min,max:zc.max,step:zc.step||.1,v:tr.getSettings().zoom??zc.min}:null;
    if(cam.zoom&&cam.wide)await setZoom(cam.zoom.min);
    cam.dev=tr.getSettings().deviceId||'';const saved=localStorage.getItem('kp-rot:'+cam.dev);
    cam.rot=saved!=null?+saved:(video.videoWidth>video.videoHeight?90:0);
    const used=st.getVideoTracks()[0].getSettings().deviceId;
    cam.phase=S.pending&&!S.pending.rescanning?'captured':'live';
    await listDevices('cam:'+used);$('#liveLbl').textContent=st.getVideoTracks()[0].label||'Camera';
  }catch(e){
    if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}
    cam.phase='off';cam.zoom=null;
    toast('Chưa mở được camera: '+(e.message||e.name));
    try{await listDevices(null)}catch(e2){$('#camSource').innerHTML='<option value="ask">Chọn camera…</option>'}
    $('#liveLbl').textContent='Camera';
  }
  renderCamFoot();
}
$('#camSource').onchange=e=>{const v=e.target.value;if(v==='ask')useCamera(null);else useCamera(v.slice(4))};

/* ============ nhiều bàn: đồng bộ với kho phiếu chung trên máy chủ ============ */
// Mỗi máy 1 tên bàn (lưu trên máy). Máy chủ giữ phiếu đã duyệt + thiết lập chung; mỗi bàn hỏi thay đổi 1,5 giây/lần.
const STATION={name:localStorage.getItem('kp-station')||'Bàn 1'};
const SH={on:false,ok:false,epoch:null,rev:0,first:true,hdr:()=>({'Content-Type':'application/json','X-Station':encodeURIComponent(STATION.name)})};
const PUSH_SKIP=new Set(['composite','crops','raw','snapshot','reopened','reading','rescanning','cropping','unsynced']);
async function pushBallot(b){
  if(!SH.on)return;
  const body=JSON.stringify({ballot:Object.fromEntries(Object.entries(b).filter(([k])=>!PUSH_SKIP.has(k)))});
  try{
    const r=await fetch(OCR.url+'/ballot',{method:'POST',headers:SH.hdr(),body});const j=await r.json();
    if(r.ok){b.unsynced=false;return}
    b.unsynced=false;
    if(r.status===409&&j.current){toast(b.version===1?j.error:`Phiếu #${pad3(b.no)} vừa được bàn khác sửa trước. Đã lấy bản của bàn đó; mở lại nếu cần sửa tiếp.`,null,null,7000);takeBallot(j.current);renderAll()}
    else toast(j.error||'Máy chủ không nhận phiếu',null,null,6000);
  }catch(e){b.unsynced=true;SH.ok=false;ocrLabel()}  // mất mạng: giữ lại, tự gửi khi nối lại
}
function pushCfg(body){if(SH.on)fetch(OCR.url+'/cfg',{method:'POST',headers:SH.hdr(),body:JSON.stringify(body)}).catch(()=>{})}
function takeBallot(x){
  // Phiếu từ máy chủ: tính lại kết luận theo thiết lập hiện tại (giống nhau ở mọi bàn).
  const b={...x,composite:null};b.photo=b.photo&&b.photo.startsWith('/')?OCR.url+b.photo:b.photo;
  b.rows=(b.rows||[]).map(r=>({...r,o0:r.o0||{stt:r.stt}}));b.history=b.history||[];
  if(b.rows.length){const c=computeBallot(b);b.status=c.status;b.reason=c.reason;b.votes=c.votes}
  const i=S.ballots.findIndex(y=>y.no===b.no);
  if(i<0)S.ballots.push(b);else{const old=S.ballots[i];if(old.version===b.version&&old.composite)b.composite=old.composite;S.ballots[i]=b}
  if(S.pending&&S.pending.no===b.no&&S.pending.reopened&&S.pending.version<b.version)toast(`Phiếu #${pad3(b.no)} đang sửa vừa được bàn khác sửa. Bấm Hủy sửa rồi mở lại để thấy bản mới.`,null,null,7000);
}
async function syncOnce(){
  const r=await fetch(`${OCR.url}/state?since=${SH.rev}${SH.epoch?'&epoch='+SH.epoch:''}`,{cache:'no-store',headers:{'X-Station':encodeURIComponent(STATION.name)}});const st=await r.json();
  SH.devices=st.devices||[];renderDevices();
  if(st.full&&SH.epoch&&SH.epoch!==st.epoch){S.ballots=[];if(S.pending&&!S.pending.reopened){S.pending=null;camRelease()}toast('Dữ liệu phiên vừa được xóa ở máy chủ.')}
  if(st.full)S.ballots=S.ballots.filter(b=>b.unsynced);
  if(SH.first&&!st.cfg){pushCfg({cfg:S.cfg,cands:S.cands,note:'Thiết lập ban đầu'})}  // máy đầu tiên: đưa thiết lập lên
  else if(st.cfg){const keep=S.cfg.operator;Object.assign(S.cfg,st.cfg);S.cfg.rows=NUM_ROWS;S.cfg.seats=NUM_ROWS;S.cfg.operator=st.cfg.operator||keep;
    if(st.cands&&JSON.stringify(st.cands)!==JSON.stringify(S.cands.map(c=>({stt:c.stt,name:c.name}))))setCands(st.cands)}
  S.locked=st.locked;S.nextNo=st.nextNo;
  st.ballots.forEach(takeBallot);
  const changed=st.full||st.ballots.length||st.rev!==SH.rev;
  SH.epoch=st.epoch;SH.rev=st.rev;SH.first=false;
  for(const b of S.ballots)if(b.unsynced)await pushBallot(b);
  return changed;
}
async function syncLoop(){
  const was=SH.ok;let changed=false;
  try{changed=await syncOnce();SH.ok=true}catch(e){SH.ok=false;SH.devices=[];renderDevices()}
  if(was!==SH.ok)ocrLabel();
  if(changed){renderTop();if(!S.pending)renderBallot();refreshList();if(ovMode==='res')renderResults()}
  setTimeout(syncLoop,SH.ok?1500:3000);
}

/* ============ modal + toast ============ */
function openModal(html){$('#modal').innerHTML=html;$('#modalWrap').classList.add('open');$('#modal').querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}
function closeModal(){$('#modalWrap').classList.remove('open')}
let toastTimer;
function toast(msg,act,fn,ms=3200){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${act?`<button class="btn btn-sm">${esc(act)}</button>`:''}`;if(act)t.querySelector('button').onclick=()=>{t.classList.remove('show');fn()};t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms)}

/* ============ phím tắt ============ */
document.addEventListener('keydown',e=>{
  const ae=document.activeElement,typing=['INPUT','TEXTAREA','SELECT'].includes(ae?.tagName);
  if($('#modalWrap').classList.contains('open')){if(e.key==='Escape')closeModal();return}
  if(document.querySelector('.zoomed')&&e.key==='Escape'){document.querySelector('.zoomed').remove();return}
  if(ovMode){if(e.key==='Escape')closeOverlay();return}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();ae?.blur?.();accept();return}
  if(typing){
    if(e.key==='Enter'&&ae.dataset.fk){e.preventDefault();const all=[...document.querySelectorAll('#ballotBody [data-fk]:not(:disabled)')];const nx=all[all.indexOf(ae)+1];nx?nx.focus():ae.blur()}
    if(e.key==='Escape')ae.blur();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='enter'){e.preventDefault();accept()}else if(k==='r')rescan();else if(k==='i'){const p=$('#badPop');if(p)p.hidden=!p.hidden}else if(k==='l')$('#btnList').click();else if(k==='k')openOverlay('res');else if(k===' '){e.preventDefault();realSnap()}
});

function renderAll(){renderTop();renderBallot();refreshList();if(ovMode==='res')renderResults()}
setCands(parseCands(loadCandText()).list);renderCamFoot();pingOcr();setInterval(pingOcr,8000);renderAll();if(!NOCAM){requestAnimationFrame(loop);useCamera(null)}
</script>
